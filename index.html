<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bilibili Minecraft 基岩版创作者</title>
<style>
:root { color-scheme: dark;
  --site-bg: #0d1015; --site-fg: #e8e8e8; --site-accent: #7d9fc7; --site-on-accent: #2b3a4d;
  --site-surface: #151a22; --site-muted: #8b93a1; --site-border: #2b323d;
  --site-font: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  --site-radius: 5px; --site-space: 1; --site-type: 1; --site-motion: 1; }
@media (prefers-reduced-motion: reduce) { :root { --site-motion: 0.01; } }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--site-bg); color: var(--site-fg);
  font: 13px/1.55 var(--site-font); overscroll-behavior: none; }
#chart { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; -webkit-tap-highlight-color: transparent; }
#chart.dragging { cursor: grabbing; }
.hud { position: fixed; pointer-events: none; z-index: 3; left: calc(18px + env(safe-area-inset-left)); top: calc(16px + env(safe-area-inset-top)); }
.hud h1 { font-size: calc(15px * var(--site-type, 1)); font-weight: 600; margin: 0 0 3px; letter-spacing: .02em; }
.hud p { margin: 0; color: var(--site-muted); font-size: calc(12px * var(--site-type, 1)); }
.controls { display: flex; flex-direction: column; align-items: flex-start; gap: calc(7px * var(--site-space, 1)); margin-top: 10px; pointer-events: auto; }
.controls label { display: inline-flex; align-items: center; gap: 8px; color: var(--site-muted); font-size: calc(12px * var(--site-type, 1)); cursor: pointer; user-select: none; }
.controls select { background: var(--site-surface); color: #d7dde6; border: 1px solid var(--site-border); border-radius: var(--site-radius); padding: 3px 7px; font: inherit; font-size: 12px; cursor: pointer; outline: none; }
.controls select:hover { border-color: #3b4553; }
#eraSwitch { display: inline-flex; border: 1px solid var(--site-border); border-radius: 6px; overflow: hidden; }
#eraSwitch button { background: var(--site-surface); color: var(--site-muted); border: 0; padding: 4px 11px; font: inherit; font-size: 12px; cursor: pointer; }
#eraSwitch button + button { border-left: 1px solid var(--site-border); }
#eraSwitch button.on { background: var(--site-on-accent); color: #dce6f2; }
#eraSwitch button:hover:not(.on) { color: #d7dde6; }
#avatarToggle input { accent-color: var(--site-accent); margin: 0; }
#tip { position: fixed; z-index: 5; display: none; pointer-events: none; background: rgba(19,22,28,.97);
  border: 1px solid var(--site-border); border-radius: calc(var(--site-radius) + 2px); padding: 9px 11px; box-shadow: 0 8px 24px rgba(0,0,0,.35); max-width: calc(100vw - 24px); }
#tip .row { display: flex; gap: 9px; align-items: center; }
#tip img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex: none; background: var(--site-border); }
#tip .sub { color: var(--site-muted); }
#toolbox { position: fixed; z-index: 6; right: calc(14px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom));
  height: 42px; display: flex; align-items: center; background: rgba(19,22,28,.97); border: 1px solid var(--site-border); border-radius: 999px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
#toolBody { display: flex; align-items: center; max-width: 0; opacity: 0; overflow: hidden; visibility: hidden;
  transition: max-width calc(220ms * var(--site-motion, 1)) cubic-bezier(.4,0,.2,1), opacity calc(180ms * var(--site-motion, 1)) ease, visibility 0s linear calc(220ms * var(--site-motion, 1)); }
#toolbox.open #toolBody, #toolbox.toolmode #toolBody { max-width: 300px; opacity: 1; visibility: visible;
  transition: max-width calc(220ms * var(--site-motion, 1)) cubic-bezier(.4,0,.2,1), opacity calc(180ms * var(--site-motion, 1)) ease, visibility 0s; }
#toolButtons { display: flex; align-items: center; padding-left: 5px; gap: 2px; }
#toolStatus { display: none; align-items: center; min-width: 0; }
#toolbox.toolmode #toolButtons { display: none; }
#toolbox.toolmode #toolStatus { display: flex; }
.tool-btn { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 0; background: transparent; color: #8b93a1; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; }
.tool-btn:hover { color: #e8e8e8; background: rgba(255,255,255,.06); }
#toolToggle { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; color: #8b93a1; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; }
#toolToggle:hover { color: #e8e8e8; }
#toolToggle svg { display: block; }
#toolToggle .ic-open { transition: transform calc(200ms * var(--site-motion, 1)) ease; }
#toolbox.open #toolToggle .ic-open { transform: rotate(180deg); }
#toolToggle .ic-close { display: none; }
#toolbox.toolmode #toolToggle .ic-open { display: none; }
#toolbox.toolmode #toolToggle .ic-close { display: block; }
#feedbackBtn { position: fixed; z-index: 6; left: calc(14px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom));
  height: 34px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; background: rgba(19,22,28,.97);
  border: 1px solid var(--site-border); border-radius: 999px; color: var(--site-muted); font: inherit; font-size: 12px;
  cursor: pointer; text-decoration: none; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
#feedbackBtn:hover { color: var(--site-fg); border-color: #3b4553; }
#curateBar { position: fixed; z-index: 7; left: calc(14px + env(safe-area-inset-left)); bottom: calc(56px + env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: center; }
#curateBar button { height: 30px; padding: 0 12px; border-radius: 999px; background: rgba(19,22,28,.97); border: 1px solid var(--site-border); color: var(--site-muted); font: inherit; font-size: 12px; cursor: pointer; }
#curateBar button:hover { color: var(--site-fg); border-color: #3b4553; }
.cbadge { color: #ffb86b; font-size: 12px; }
.chint { color: var(--site-muted); font-size: 12px; }
#toolbox.remind::after { content: ""; position: absolute; inset: 0; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.7); animation: ripple 1.2s ease-out; pointer-events: none; }
@keyframes ripple { from { inset: 0; opacity: .7; } to { inset: -13px; opacity: 0; } }
#searchStatus { display: flex; align-items: center; gap: 9px; min-width: 0; padding: 0 4px 0 13px; cursor: pointer; }
.sr-face, .ss-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex: none; background: #2b323d; }
.face-fallback { display: flex; align-items: center; justify-content: center; color: #d7dde6; font-size: 13px; }
.ss-text { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
.ss-text b { font-size: 13px; font-weight: 600; max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ss-text span { font-size: 11px; color: #8b93a1; }
.ss-text b.ph { color: #8b93a1; font-weight: 500; }
.ss-hint { display: flex; align-items: center; gap: 7px; color: #8b93a1; font-size: 12px; white-space: nowrap; }
.duo { display: flex; align-items: center; flex: none; }
.duo .ss-avatar { box-shadow: 0 0 0 2px rgba(19,22,28,.97); }
.duo .ss-avatar + .ss-avatar { margin-left: -12px; }
#connectSlots { padding: 2px 0 10px; }
.slot { display: flex; align-items: center; gap: 10px; width: calc(100% - 24px); margin: 6px 12px; padding: 7px 10px;
  background: transparent; border: 1px dashed #2b323d; border-radius: 8px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
.slot:hover { border-color: #3b4553; background: rgba(255,255,255,.03); }
.slot.filled { border-style: solid; }
.head-actions { display: flex; gap: 4px; }
#connectModal .modal-cancel { display: none; }
#connectModal.change .modal-cancel { display: flex; }
#connectModal.change #connectModalClose { display: none; }
#searchModal .ic-minus { display: none; }
#searchModal.change .ic-minus { display: block; }
#searchModal.change .ic-close { display: none; }
#searchModal, #connectModal { position: fixed; inset: 0; z-index: 10; display: none; align-items: flex-start; justify-content: center;
  padding: 12vh 16px 16px; background: rgba(0,0,0,.45); }
#searchModal.open, #connectModal.open { display: flex; }
.modal-panel { width: 340px; max-width: 100%; background: rgba(19,22,28,.97); border: 1px solid #333a46; border-radius: 10px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 0 14px; color: #8b93a1; font-size: 12px; }
.modal-close { width: 26px; height: 26px; border-radius: 50%; border: 0; background: transparent; color: #8b93a1; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; }
.modal-close:hover { color: #e8e8e8; background: rgba(255,255,255,.06); }
#searchInput { display: block; box-sizing: border-box; width: calc(100% - 28px); margin: 8px 14px 12px; background: #0d1015; color: #e8e8e8;
  border: 1px solid #2b323d; border-radius: 5px; padding: 7px 9px; font: inherit; font-size: 13px; outline: none; }
#searchInput:focus { border-color: #3b4553; }
#searchResults { max-height: 264px; overflow-y: auto; border-top: 1px solid #232a34; }
.sr-row { display: flex; align-items: center; gap: 10px; padding: 8px 14px; cursor: pointer; }
.sr-row:hover { background: rgba(255,255,255,.05); }
.sr-row.disabled { cursor: default; opacity: .38; }
.sr-row.disabled:hover { background: transparent; }
.sr-text { min-width: 0; line-height: 1.3; }
.sr-text b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr-text span { font-size: 11px; color: #8b93a1; }
.sr-empty, .sr-end { padding: 16px 14px; color: #8b93a1; font-size: 12px; text-align: center; }
.sr-end { padding: 4px 14px 12px; font-size: 11px; }
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--site-bg); color: var(--site-muted); font-size: 13px; z-index: 9; transition: opacity calc(200ms * var(--site-motion, 1)); }
#loading.hide { opacity: 0; pointer-events: none; }
@media (max-width: 640px) {
  .hud h1 { font-size: 13px; } .hud p { font-size: 11px; }
  #tip { padding: 8px 10px; font-size: 12px; } #tip img { width: 34px; height: 34px; }
  #toolbox { right: calc(12px + env(safe-area-inset-right)); bottom: calc(12px + env(safe-area-inset-bottom)); }
  .ss-text b { max-width: 108px; }
  #searchModal, #connectModal { padding: 9vh 12px 16px; }
  .modal-panel { width: calc(100vw - 24px); }
}
</style>
</head>
<body>
<canvas id="chart"></canvas>
<div class="hud">
  <h1>Bilibili Minecraft 基岩版创作者</h1>
  <p id="eraDesc">2011-08-06 至今 · 联合投稿 + @提及</p>
  <p id="stat">加载中…</p>
  <div class="controls">
    <div id="eraSwitch">
      <button data-era="all" class="on">全部</button>
      <button data-era="pe">携带版</button>
      <button data-era="br">基岩版</button>
    </div>
    <label>布局方案
      <select id="layoutSelect">
        <option value="flat">平铺</option>
        <option value="hierarchy">层级</option>
        <option value="hub">枢纽</option>
        <option value="comm">社区</option>
      </select>
    </label>
    <label id="avatarToggle"><input type="checkbox" id="allAvatars"> 全部头像</label>
  </div>
</div>
<div id="tip"></div>
<a id="feedbackBtn" href="https://wj.qq.com/s2/28773984/zrir/" target="_blank" rel="noopener">反馈</a>
<div id="curateBar" style="display:none">
  <span class="cbadge">管理模式</span>
  <span class="chint">点击选中，Delete 删除并连带邻居</span>
  <button id="curateAdd">添加人物</button>
  <button id="curateExport">导出删除清单</button>
  <button id="curateClear">撤销全部</button>
</div>
<div id="toolbox">
  <div id="toolBody">
    <div id="toolButtons">
      <button class="tool-btn" id="toolSearchBtn" title="搜索创作者" aria-label="搜索创作者">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5l-4.3-4.3"/></svg>
      </button>
      <button class="tool-btn" id="toolConnectBtn" title="连接两位创作者" aria-label="连接两位创作者">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="2.6"/><circle cx="19" cy="12" r="2.6"/><path d="M7.8 12h8.4"/></svg>
      </button>
    </div>
    <div id="toolStatus"><div id="searchStatus"></div></div>
  </div>
  <button id="toolToggle" aria-label="展开工具栏">
    <svg class="ic-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
    <svg class="ic-close" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</div>
<div id="searchModal">
  <div class="modal-panel">
    <div class="modal-head"><span id="searchTitle">搜索创作者</span>
      <span class="head-actions">
        <button class="modal-close ic-minus" id="searchModalCancel" aria-label="取消更改"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button class="modal-close ic-close" id="searchModalClose" aria-label="关闭"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </span>
    </div>
    <input id="searchInput" placeholder="输入名字或 UID" autocomplete="off">
    <div id="searchResults"></div>
  </div>
</div>
<div id="connectModal">
  <div class="modal-panel">
    <div class="modal-head"><span>连接两位创作者</span>
      <span class="head-actions">
        <button class="modal-close modal-cancel" id="connectModalCancel" aria-label="取消更改"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button class="modal-close" id="connectModalClose" aria-label="关闭"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </span>
    </div>
    <div id="connectSlots">
      <button class="slot" id="connectSlotA"></button>
      <button class="slot" id="connectSlotB"></button>
    </div>
  </div>
</div>
<div id="loading"><span id="loadText">加载数据…</span></div>
<script src="data.js"></script>
<script>
(function () {
"use strict";
var GRAPH = window.GRAPH;
var canvas = document.getElementById("chart");
var ctx = canvas.getContext("2d", { alpha: false });
var loading = document.getElementById("loading");
var stat = document.getElementById("stat");
var eraDesc = document.getElementById("eraDesc");
var tip = document.getElementById("tip");
var allAvatars = document.getElementById("allAvatars");
if (!GRAPH || !Array.isArray(GRAPH.nodes)) { stat.textContent = "数据缺失"; loading.classList.add("hide"); return; }

var ERA_INFO = {
  all: "2011-08-06 至今 · 联合投稿 + @提及",
  pe: "携带版时代 2011-08-06 ~ 2017-09-19",
  br: "基岩版时代 2017-09-20 至今"
};
var era = "all", layoutName = "flat";
var nodes = [], edges = [], incidentEdges = [], indexById = new Map();
var layoutGroups = null, groupColors = null, layoutReady = false;
var layoutCache = {}, loadToken = 0;
var showAllAvatars = false;
var DPR_CAP = 2, dpr = 1, width = 1, height = 1, strokeUnit = 1;
var MIN_SCALE = 0.04, MAX_SCALE = 5, AVATAR_MIN_R = 5;
var view = { scale: 1, ox: 0, oy: 0, ready: false }, fitScale = 1;
var interacting = false, interactionTimer = 0;
var screenR = new Float32Array(0);
var palette = ["#5d7089", "#7d9fc7", "#8f7fb8", "#6f9e8a", "#b08d6a", "#a7748a", "#6a9bb0", "#9a9a6a"];

function fnv(ids) {
  var h = 0x811c9dc5, s = ids.join(",");
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, "0");
}
function faceUrl(f) {
  if (!f) return "";
  if (f.indexOf("//") === 0) return "https:" + f;
  if (f.indexOf("http://") === 0) return "https://" + f.slice(7);
  return f;
}
function escapeHtml(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function communityColor(g) {
  var hue = (g * 137.508) % 360, sat = 38 + (g * 53 % 3) * 7, light = 55 + (g * 31 % 3) * 7;
  return "hsl(" + hue.toFixed(1) + "," + sat + "%," + light + "%)";
}
function lighten(hex, k) {
  if (hex[0] !== "#") return hex;
  var n = parseInt(hex.slice(1), 16);
  var r = Math.round(((n >> 16) & 255) + (255 - ((n >> 16) & 255)) * k);
  var g = Math.round(((n >> 8) & 255) + (255 - ((n >> 8) & 255)) * k);
  var b = Math.round((n & 255) + (255 - (n & 255)) * k);
  return "rgb(" + r + "," + g + "," + b + ")";
}
function nodeColor(i) {
  if (layoutName === "comm" && groupColors) return groupColors[layoutGroups[i]] || palette[0];
  var d = nodes[i].degree;
  return d >= 10 ? "#7d9fc7" : (d >= 4 ? "#5d7089" : "#465366");
}

var CURATE = /[?&]curate=1\b/.test(location.search);
var curateDeleted = new Set([]);
try {
  var savedDel = JSON.parse(localStorage.getItem("curate_delete") || "[]");
  (savedDel || []).forEach(function (id) { curateDeleted.add(String(id)); });
} catch (e) {}
var curateHidden = function (id) { return CURATE && curateDeleted.has(String(id)); };
var curateSel = -1;
var curateAdded = [];
try { curateAdded = JSON.parse(localStorage.getItem("curate_add") || "[]") || []; } catch (e) { curateAdded = []; }

function buildView() {
  curateSel = -1;
  var vn = GRAPH.nodes.filter(function (n) { return era === "all" || n[era]; });
  nodes = vn.map(function (n) {
    return { id: String(n.id), name: n.name || "", face: faceUrl(n.face), vpe: n.vpe || 0, vbr: n.vbr || 0,
             degree: 0, radius: 8, x: 0, y: 0, avatar: null, avatarState: 0, avatarFade: 0 };
  });
  indexById = new Map();
  nodes.forEach(function (n, i) { indexById.set(n.id, i); });
  edges = [];
  GRAPH.links.forEach(function (l) {
    if (era !== "all" && !l[era]) return;
    var a = indexById.get(String(l.source)), b = indexById.get(String(l.target));
    if (a === undefined || b === undefined || a === b) return;
    edges.push({ a: a, b: b, j: l.j });
  });
  incidentEdges = nodes.map(function () { return []; });
  edges.forEach(function (e, i) {
    nodes[e.a].degree++; nodes[e.b].degree++;
    incidentEdges[e.a].push(i); incidentEdges[e.b].push(i);
  });
  nodes.forEach(function (n) { n.radius = 8 + Math.min(12, Math.sqrt(n.degree) * 2.8); });
  screenR = new Float32Array(nodes.length);
  stat.textContent = nodes.length + "人 " + edges.length + "边";
  eraDesc.textContent = ERA_INFO[era];
}

function fitTarget() {
  var pts = nodes.filter(function (n) { return n.degree > 0; });
  if (!pts.length) pts = nodes;
  var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  pts.forEach(function (n) {
    minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x);
    minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y);
  });
  var pad = Math.max(24, Math.min(55, Math.min(width, height) * 0.08));
  var gw = Math.max(maxX - minX, 1), gh = Math.max(maxY - minY, 1);
  var scale = Math.max(MIN_SCALE, Math.min(Math.min((width - pad * 2) / gw, (height - pad * 2) / gh), 1.4));
  return { scale: scale, ox: width / 2 - (minX + maxX) / 2 * scale, oy: height / 2 - (minY + maxY) / 2 * scale };
}
function fit() {
  var t = fitTarget();
  view.scale = t.scale; view.ox = t.ox; view.oy = t.oy; fitScale = t.scale; view.ready = true;
}

function loadLayout(name, first) {
  var key = era + "_" + name, token = ++loadToken;
  var data = layoutCache[key];
  var p = data ? Promise.resolve(data) : fetch("layouts/" + key + ".json").then(function (r) {
    if (!r.ok) throw new Error("layout");
    return r.json();
  }).then(function (d) { layoutCache[key] = d; return d; });
  return p.then(function (d) {
    if (token !== loadToken) return;
    if (d.count !== nodes.length || d.hash !== fnv(nodes.map(function (n) { return n.id; }))) throw new Error("布局校验失败");
    layoutGroups = d.group || null;
    for (var i = 0; i < nodes.length; i++) { nodes[i].x = d.x[i]; nodes[i].y = d.y[i]; }
    if (layoutGroups) {
      var max = 0;
      layoutGroups.forEach(function (g) { max = Math.max(max, g); });
      groupColors = [];
      for (var g = 0; g <= max; g++) groupColors.push(communityColor(g));
    } else groupColors = null;
    layoutName = name; layoutReady = true;
    fit();
    if (!first) scheduleDraw();

var ICON_CONNECT = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="2.6"/><circle cx="19" cy="12" r="2.6"/><path d="M7.8 12h8.4"/></svg>';
function setToolbarOpen(open) {
  toolbox.classList.toggle("open", open);
  if (!activeTool) toolToggle.setAttribute("aria-label", open ? "收起工具栏" : "展开工具栏");
}
function scheduleReminder() {
  clearTimeout(remindTimer);
  if (!activeTool) return;
  remindTimer = setTimeout(function () {
    if (!activeTool) return;
    toolbox.classList.remove("remind");
    void toolbox.offsetWidth;
    toolbox.classList.add("remind");
    setTimeout(function () { toolbox.classList.remove("remind"); }, 1300);
    scheduleReminder();
  }, 2000);
}
function noteGesture() { if (toolbox.classList.contains("open") && !activeTool) setToolbarOpen(false); }
function animateTool(target, done) {
  if (toolAnim) cancelAnimationFrame(toolAnim);
  var from = toolAmount, start = performance.now(), dur = target > from ? 200 : 160;
  function step(now) {
    var p = Math.min(1, (now - start) / dur), e = p * p * (3 - 2 * p);
    toolAmount = from + (target - from) * e;
    scheduleDraw();
    if (p < 1) toolAnim = requestAnimationFrame(step);
    else { toolAnim = 0; if (target === 0 && done) done(); }
  }
  toolAnim = requestAnimationFrame(step);
}
function faceHtml(n, cls) {
  var ch = (n.name || "?").trim().charAt(0) || "?";
  return n.face ? '<img class="' + cls + '" src="' + escapeHtml(n.face) + '" referrerpolicy="no-referrer" alt="">' :
    '<span class="' + cls + ' face-fallback">' + escapeHtml(ch) + "</span>";
}
function renderToolStatus() {
  if (activeTool === "search") {
    if (searchFocus) {
      var n = nodes[searchFocus.node];
      searchStatus.innerHTML = faceHtml(n, "ss-avatar") + '<span class="ss-text"><b>' + escapeHtml(n.name) + "</b><span>" + escapeHtml(n.id) + "</span></span>";
    } else searchStatus.innerHTML = '<span class="ss-hint">' + ICON_SEARCH + "<span>搜索创作者…</span></span>";
  } else if (activeTool === "connect") {
    if (connectPicks.a < 0 || connectPicks.b < 0) {
      searchStatus.innerHTML = '<span class="ss-hint">' + ICON_CONNECT + "<span>连接两位创作者</span></span>";
    } else if (connectFocus) {
      var duo = '<span class="duo">' + faceHtml(nodes[connectPicks.a], "ss-avatar") + faceHtml(nodes[connectPicks.b], "ss-avatar") + "</span>";
      var txt;
      if (connectFocus.same) txt = "<b>同一创作者</b><span>这是同一个人呀</span>";
      else if (connectFocus.direct) txt = "<b>直接相连</b><span>他们之间没有中间人</span>";
      else if (connectFocus.connected) txt = "<b>" + connectFocus.count + " 位创作者</b><span>将他们连接起来</span>";
      else txt = "<b>他们现在连不上</b><span>这两个时代还没交集</span>";
      searchStatus.innerHTML = duo + '<span class="ss-text">' + txt + "</span>";
    }
  }
}
function setToolMode(tool) {
  activeTool = tool;
  toolbox.classList.toggle("toolmode", !!tool);
  toolToggle.setAttribute("aria-label", tool ? "退出工具" : "展开工具栏");
  scheduleReminder();
}
function openSearchModal(asPicker) {
  pickerSlot = asPicker || null;
  searchModal.classList.add("open");
  clearTimeout(remindTimer);
  var change = !!pickerSlot || !!searchFocus;
  searchModal.classList.toggle("change", change);
  document.getElementById("searchTitle").textContent = pickerSlot ? "选择创作者" : "搜索创作者";
  searchInput.value = "";
  renderResults("");
  setTimeout(function () { searchInput.focus(); }, 0);
}
function closeSearchModal() {
  searchModal.classList.remove("open", "change");
  scheduleReminder();
}
function openConnectModal() {
  connectModal.classList.add("open");
  clearTimeout(remindTimer);
  connectModal.classList.toggle("change", connectPicks.a >= 0 && connectPicks.b >= 0);
  renderConnectSlots();
}
function closeConnectModal() {
  connectModal.classList.remove("open", "change");
  scheduleReminder();
}
function activateTool(tool) {
  setToolMode(tool);
  setToolbarOpen(true);
  if (tool === "search") { searchFocus = null; renderToolStatus(); openSearchModal(); }
  else { connectPicks.a = connectPicks.b = -1; connectFocus = null; renderToolStatus(); openConnectModal(); }
}
function exitTool() {
  setToolMode(null);
  pickerSlot = null;
  hideTip();
  if (searchFocus || connectFocus) {
    animateTool(0, function () { searchFocus = null; connectFocus = null; });
  }
}
toolToggle.addEventListener("click", function () {
  if (activeTool) exitTool();
  else setToolbarOpen(!toolbox.classList.contains("open"));
});
document.getElementById("toolSearchBtn").addEventListener("click", function () { activateTool("search"); });
document.getElementById("toolConnectBtn").addEventListener("click", function () { activateTool("connect"); });
searchStatus.addEventListener("click", function () {
  if (activeTool === "search") openSearchModal();
  else if (activeTool === "connect") openConnectModal();
});
document.getElementById("searchModalClose").addEventListener("click", function () {
  closeSearchModal();
  if (!searchFocus) exitTool();
});
document.getElementById("searchModalCancel").addEventListener("click", function () {
  var wasPicker = !!pickerSlot;
  closeSearchModal();
  pickerSlot = null;
  if (wasPicker) openConnectModal();
  else if (!searchFocus) exitTool();
});
searchModal.addEventListener("click", function (ev) {
  if (ev.target === searchModal) document.getElementById(searchModal.classList.contains("change") ? "searchModalCancel" : "searchModalClose").click();
});
document.getElementById("connectModalClose").addEventListener("click", function () { closeConnectModal(); exitTool(); });
document.getElementById("connectModalCancel").addEventListener("click", function () { closeConnectModal(); });
connectModal.addEventListener("click", function (ev) {
  if (ev.target === connectModal) document.getElementById(connectModal.classList.contains("change") ? "connectModalCancel" : "connectModalClose").click();
});
function pickerDisabled() {
  if (!pickerSlot) return -1;
  return pickerSlot === "a" ? connectPicks.b : connectPicks.a;
}
function searchNodes(q) {
  q = q.trim();
  if (!q) return [];
  var ql = q.toLowerCase(), exact = indexById.get(q);
  var head = exact === undefined ? [] : [exact];
  var rest = [];
  for (var i = 0; i < nodes.length; i++) {
    if (i === exact || !nodes[i].name) continue;
    if (nodes[i].name.toLowerCase().indexOf(ql) >= 0) rest.push(i);
  }
  rest.sort(function (a, b) { return nodes[b].degree - nodes[a].degree; });
  var list = head.concat(rest), dis = pickerDisabled();
  if (dis >= 0 && list.indexOf(dis) >= 0) {
    list.splice(list.indexOf(dis), 1);
    list = list.slice(0, 8);
    list.push(dis);
  }
  return list.slice(0, 8);
}
function renderResults(q) {
  if (!q.trim()) { searchResults.innerHTML = ""; return; }
  var list = searchNodes(q), dis = pickerDisabled();
  if (!list.length) { searchResults.innerHTML = '<div class="sr-empty">没有匹配的创作者</div>'; return; }
  var html = "";
  list.forEach(function (i) {
    var n = nodes[i], off = i === dis;
    html += '<div class="sr-row' + (off ? " disabled" : "") + '" data-i="' + i + '">' + faceHtml(n, "sr-face") +
      '<span class="sr-text"><b>' + escapeHtml(n.name) + "</b><span>" + escapeHtml(n.id) + " · " + n.degree + " 个合作</span></span></div>";
  });
  html += '<div class="sr-end">已经到底了</div>';
  searchResults.innerHTML = html;
}
searchInput.addEventListener("input", function () { renderResults(this.value); });
searchResults.addEventListener("click", function (ev) {
  var row = ev.target.closest(".sr-row");
  if (!row || row.classList.contains("disabled")) return;
  var i = +row.dataset.i;
  if (pickerSlot) {
    connectPicks[pickerSlot] = i;
    pickerSlot = null;
    closeSearchModal();
    openConnectModal();
    if (connectPicks.a >= 0 && connectPicks.b >= 0) finishConnect();
    return;
  }
  closeSearchModal();
  hideTip();
  connectFocus = null;
  var nb = new Set();
  incidentEdges[i].forEach(function (ei) { nb.add(edges[ei].a); nb.add(edges[ei].b); });
  nb.delete(i);
  searchFocus = { node: i, neighbors: nb };
  renderToolStatus();
  animateTool(1);
  focusNode(i);
});
function renderConnectSlots() {
  ["a", "b"].forEach(function (key) {
    var el = document.getElementById(key === "a" ? "connectSlotA" : "connectSlotB");
    var i = connectPicks[key];
    if (i >= 0) {
      var n = nodes[i];
      el.classList.add("filled");
      el.innerHTML = faceHtml(n, "ss-avatar") + '<span class="ss-text"><b>' + escapeHtml(n.name) + "</b><span>" + escapeHtml(n.id) + "</span></span>";
    } else {
      el.classList.remove("filled");
      el.innerHTML = '<span class="ss-avatar face-fallback">+</span><span class="ss-text"><b class="ph">点击选择创作者</b></span>';
    }
  });
}
document.getElementById("connectSlotA").addEventListener("click", function () { closeConnectModal(); openSearchModal("a"); });
document.getElementById("connectSlotB").addEventListener("click", function () { closeConnectModal(); openSearchModal("b"); });
function shortestPath(from, to) {
  if (from === to) return { nodes: [from], edges: [] };
  var prev = new Array(nodes.length).fill(-1), prevE = new Array(nodes.length).fill(-1);
  prev[from] = from;
  var queue = [from];
  for (var qi = 0; qi < queue.length; qi++) {
    var cur = queue[qi];
    var list = incidentEdges[cur];
    for (var li = 0; li < list.length; li++) {
      var ei = list[li], ed = edges[ei];
      var nxt = ed.a === cur ? ed.b : ed.a;
      if (prev[nxt] !== -1) continue;
      prev[nxt] = cur; prevE[nxt] = ei;
      if (nxt === to) {
        var pn = [], pe = [], c = to;
        while (c !== from) { pn.push(c); pe.push(prevE[c]); c = prev[c]; }
        pn.push(from); pn.reverse(); pe.reverse();
        return { nodes: pn, edges: pe };
      }
      queue.push(nxt);
    }
  }
  return null;
}
function frameNodes(set) {
  var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  set.forEach(function (i) {
    var n = nodes[i];
    minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x);
    minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y);
  });
  var x1 = minX * view.scale + view.ox, y1 = minY * view.scale + view.oy;
  var x2 = maxX * view.scale + view.ox, y2 = maxY * view.scale + view.oy;
  var m = 60;
  if (x1 >= m && y1 >= m && x2 <= width - m && y2 <= height - m) return;
  var bw = Math.max(maxX - minX, 1), bh = Math.max(maxY - minY, 1);
  var scale = Math.max(MIN_SCALE, Math.min(Math.min((width - 120) / bw, (height - 120) / bh), view.scale));
  animateView(scale, width / 2 - (minX + maxX) / 2 * scale, height / 2 - (minY + maxY) / 2 * scale, 260);
}
function finishConnect() {
  closeConnectModal();
  hideTip();
  searchFocus = null;
  var same = connectPicks.a === connectPicks.b;
  var path = shortestPath(connectPicks.a, connectPicks.b);
  if (path) {
    connectFocus = { nodes: new Set(path.nodes), edges: path.edges, endpoints: new Set([connectPicks.a, connectPicks.b]),
                     count: Math.max(0, path.nodes.length - 2), connected: true, same: same, direct: !same && path.nodes.length === 2 };
    animateTool(1);
  } else {
    connectFocus = { nodes: new Set([connectPicks.a, connectPicks.b]), edges: [], endpoints: new Set([connectPicks.a, connectPicks.b]),
                     count: 0, connected: false, same: same, direct: false };
  }
  renderToolStatus();
  frameNodes(connectFocus.nodes);
}

// 时代 / 布局切换
document.getElementById("eraSwitch").addEventListener("click", function (ev) {
  var btn = ev.target.closest("button");
  if (!btn || btn.dataset.era === era) return;
  era = btn.dataset.era;
  Array.prototype.forEach.call(this.children, function (b) { b.classList.toggle("on", b === btn); });
  switchView();
});
document.getElementById("layoutSelect").addEventListener("change", function () {
  var name = this.value;
  stat.textContent = "切换布局中…";
  loadLayout(name, false).then(function () {
    stat.textContent = nodes.length + "人 " + edges.length + "边";
  }).catch(function () { stat.textContent = "布局加载失败"; });
});
function switchView() {
  exitTool();
  setToolMode(null);
  searchFocus = null; connectFocus = null; toolAmount = 0;
  hideTip();
  layoutReady = false;
  buildView();
  stat.textContent = "切换中…";
  loadLayout(layoutName, false).then(function () {
    stat.textContent = nodes.length + "人 " + edges.length + "边";
  }).catch(function (e) {
    stat.textContent = "布局加载失败";
  });
}

window.addEventListener("resize", resizeCanvas);
if (window.visualViewport) window.visualViewport.addEventListener("resize", resizeCanvas);
resizeCanvas();
buildView();
loadLayout("flat", true).then(function () {
  loading.classList.add("hide");
  scheduleDraw();
}).catch(function () {
  stat.textContent = "布局加载失败(需要 layouts/ 目录)";
  loading.classList.add("hide");
});
function refreshAfterCurate() {
  curateSel = -1;
  hideTip();
  stat.textContent = nodes.length + "人 " + edges.length + "边（已隐藏 " + curateDeleted.size + " 人）";
  scheduleDraw();
}
if (CURATE) {
  var cbar = document.getElementById("curateBar");
  if (cbar) cbar.style.display = "flex";
  document.getElementById("curateExport").addEventListener("click", function () {
    var arr = [];
    curateDeleted.forEach(function (id) {
      var nm = "";
      for (var i = 0; i < GRAPH.nodes.length; i++) {
        if (String(GRAPH.nodes[i].id) === String(id)) { nm = GRAPH.nodes[i].name; break; }
      }
      arr.push({ id: String(id), name: nm });
    });
    var blob = new Blob([JSON.stringify({ delete: arr, add: curateAdded }, null, 1)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "curation.json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  document.getElementById("curateAdd").addEventListener("click", function () {
    var v = prompt("输入 B站 UID（纯数字）或创作者名称：");
    if (!v) return;
    v = v.trim();
    if (!v) return;
    var item = /^\d+$/.test(v) ? { id: v, name: "" } : { id: "", name: v };
    curateAdded.push(item);
    localStorage.setItem("curate_add", JSON.stringify(curateAdded));
    alert("已加入待添加清单（" + curateAdded.length + " 人）。\n导出清单后由维护者重建，才能出现在全站图上。");
  });
  document.getElementById("curateClear").addEventListener("click", function () {
    if (!confirm("撤销全部删除和添加？")) return;
    curateDeleted.clear();
    curateAdded = [];
    localStorage.removeItem("curate_delete");
    localStorage.removeItem("curate_add");
    refreshAfterCurate();
  });
  window.addEventListener("keydown", function (ev) {
    if (!CURATE) return;
    var t = ev.target || {};
    if (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable) return;
    if (ev.key !== "Delete" && ev.key !== "Backspace") return;
    if (curateSel < 0 || curateSel >= nodes.length) return;
    ev.preventDefault();
    var nd = nodes[curateSel];
    if (!nd) return;
    curateDeleted.add(String(nd.id));
    // 连带删除所有直接相连的节点
    incidentEdges[curateSel].forEach(function (ei) {
      var o = edges[ei].a === curateSel ? edges[ei].b : edges[ei].a;
      if (nodes[o]) curateDeleted.add(String(nodes[o].id));
    });
    localStorage.setItem("curate_delete", JSON.stringify(Array.from(curateDeleted)));
    refreshAfterCurate();
  });
}
})();
